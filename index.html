<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Une question très importante 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#ffe3ec; --bg2:#ffd0c2; --ink:#3b1f2b; --pink:#ff5c8a; --pink-d:#d93a69;
  --card:#fffaf6; --mint:#bdf0dc; --sun:#ffd166;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  font-family:'Fredoka',system-ui,sans-serif; color:var(--ink);
  background:linear-gradient(160deg,var(--bg1),var(--bg2)); background-attachment:fixed;
  overflow-x:hidden; display:flex; align-items:center; justify-content:center; padding:16px;
}
#floaters{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.floater{position:absolute;bottom:-40px;font-size:22px;opacity:.55;animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-115vh) rotate(40deg);opacity:0}}

#app{position:relative;z-index:1;width:min(560px,100%)}
.screen{
  display:none; background:var(--card); border:3px solid var(--ink); border-radius:28px;
  padding:28px 24px 26px; box-shadow:8px 8px 0 var(--ink); text-align:center;
}
.screen.active{display:block;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.88) rotate(-1.5deg);opacity:0}to{transform:none;opacity:1}}

h1{font-size:clamp(26px,6vw,36px);line-height:1.15;margin-bottom:10px}
.hand{font-family:'Caveat',cursive;font-size:26px;color:var(--pink-d)}
p.sub{margin:6px 0 18px;opacity:.8}

/* images (placeholders) */
.pic{display:block;margin:0 auto 14px;max-width:190px;max-height:190px;object-fit:contain}
.pic.wiggle{animation:wiggle 2.4s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-6px)}}
.ph{display:none;width:150px;height:150px;margin:0 auto 14px;border:3px dashed var(--pink);
  border-radius:20px;align-items:center;justify-content:center;font-size:12px;padding:8px;color:var(--pink-d)}
img.broken{display:none}
img.broken + .ph{display:flex}

/* texte machine à écrire */
#story{min-height:96px;font-size:20px;line-height:1.4}
.caret::after{content:'▍';animation:blink 1s steps(1) infinite;color:var(--pink)}
@keyframes blink{50%{opacity:0}}

/* boutons */
.btn{
  font:inherit;font-weight:600;font-size:19px;cursor:pointer;color:var(--ink);
  background:var(--sun);border:3px solid var(--ink);border-radius:999px;padding:11px 26px;
  box-shadow:0 5px 0 var(--ink);transition:transform .12s, box-shadow .12s;
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.yes{background:var(--pink);color:#fff}
.btn.no{background:#e6e0e3}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.row{display:flex;gap:16px;justify-content:center;align-items:center;flex-wrap:wrap;min-height:70px;margin-top:8px}
#noBtn.fleeing{position:fixed;z-index:50;transition:left .25s, top .25s}
#toast{min-height:26px;margin-top:10px;font-family:'Caveat',cursive;font-size:24px;color:var(--pink-d)}

/* choix */
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:8px 0 14px}
.chip{
  font:inherit;font-weight:600;font-size:17px;cursor:pointer;color:var(--ink);background:#fff;
  border:3px solid var(--ink);border-radius:18px;padding:14px 8px;transition:.15s;
}
.chip .e{display:block;font-size:30px;margin-bottom:2px}
.chip:hover{transform:rotate(-2deg) scale(1.04)}
.chip.sel{background:var(--mint);transform:scale(1.05);box-shadow:4px 4px 0 var(--ink)}
input[type=text],input[type=date],input[type=time],textarea{
  font:inherit;width:100%;padding:11px 14px;border:3px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink);margin-bottom:10px
}
input:focus,textarea:focus,.chip:focus-visible,.btn:focus-visible{outline:4px solid var(--pink);outline-offset:2px}
.other{display:none}.other.show{display:block;animation:pop .3s}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.l{display:block;text-align:left;font-weight:600;margin:6px 0 4px}
input[type=range]{width:100%;accent-color:var(--pink);margin:6px 0}
#excite{font-size:42px;display:block;margin-top:4px}

/* Chad (narrateur) */
.chad{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:12px;min-height:84px}
.chad img{width:84px;height:84px;object-fit:contain}
.chad .ph{width:84px;height:84px;margin:0;font-size:10px}
.bubble{position:relative;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px 12px;font-size:15px;text-align:left;max-width:300px}
.bubble::before{content:'';position:absolute;left:-12px;top:50%;margin-top:-8px;border:8px solid transparent;border-right-color:var(--ink);border-left:0}

/* récap */
.recap{text-align:left;background:#fff;border:3px dashed var(--pink);border-radius:18px;padding:14px 18px;margin:10px 0 16px;line-height:1.8}
.recap b{color:var(--pink-d)}

/* modal crise cardiaque */
#alert{position:fixed;inset:0;background:rgba(20,0,10,.75);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
#alert.show{display:flex}
#alert .box{background:var(--card);border:3px solid var(--ink);border-radius:24px;padding:20px;max-width:380px;text-align:center;animation:shake .5s}
#alert img{max-width:100%;max-height:300px;border-radius:12px;background:#000;margin-bottom:10px}
@keyframes shake{20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
.pulse{animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}

canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:200}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="floaters"></div>
<canvas id="confetti"></canvas>

<main id="app">

  <!-- 0. HISTOIRE -->
  <section class="screen active" id="s0">
    <img class="pic wiggle" data-img="cat" alt=""><div class="ph">IMG_CAT<br>(chat + fleur)</div>
    <div id="story" class="caret"></div>
    <div class="row"><button class="btn" id="nextStory">Suivant</button></div>
  </section>

  <!-- 1. QUESTION -->
  <section class="screen" id="s1">
    <h1 data-t="askTitle"></h1>
    <p class="hand" data-t="askSub"></p>
    <img class="pic wiggle" data-img="askCat" alt=""><div class="ph">IMG_ASK<br>(chat qui supplie)</div>
    <div class="row" id="btnRow">
      <button class="btn yes" id="yesBtn">Oui 💖</button>
      <button class="btn no" id="noBtn">Non</button>
    </div>
    <div id="toast"></div>
  </section>

  <!-- 2. ACTIVITÉ -->
  <section class="screen" id="s2">
    <div class="chad"><img data-img="chad" alt=""><div class="ph">IMG_CHAD</div><div class="bubble" id="chad2"></div></div>
    <h1 data-t="actTitle"></h1>
    <div class="chips" id="actChips"></div>
    <div class="other" id="actOther"><input type="text" id="actOtherInput" placeholder="Dis-moi tout…" maxlength="120"></div>
    <button class="btn" id="actNext" disabled>Suivant</button>
  </section>

  <!-- 3. VIBE -->
  <section class="screen" id="s3">
    <div class="chad"><img data-img="chad" alt=""><div class="ph">IMG_CHAD</div><div class="bubble" id="chad3"></div></div>
    <h1 data-t="vibeTitle"></h1>
    <div class="chips" id="vibeChips"></div>
    <div class="other" id="vibeOther"><input type="text" id="vibeOtherInput" placeholder="Ta vibe idéale…" maxlength="120"></div>
    <button class="btn" id="vibeNext" disabled>Suivant</button>
  </section>

  <!-- 4. DÉTAILS -->
  <section class="screen" id="s4">
    <h1 data-t="detTitle"></h1>
    <p class="sub" data-t="detSub"></p>
    <div class="two">
      <div><label class="l" for="dDate">Quel jour ?</label><input type="date" id="dDate"></div>
      <div><label class="l" for="dTime">Vers quelle heure ?</label><input type="time" id="dTime"></div>
    </div>
    <label class="l" for="dExcite">Niveau de hype ?</label>
    <input type="range" id="dExcite" min="0" max="4" value="2"><span id="excite">😊</span>
    <label class="l" for="dNote">Un mot, une condition, une demande spéciale ?</label>
    <textarea id="dNote" rows="3" placeholder="Au fait je gère tout !" maxlength="300"></textarea>
    <button class="btn" id="detNext">Voir le récap</button>
  </section>

  <!-- 5. RÉCAP + ENVOI -->
  <section class="screen" id="s5">
    <h1 data-t="recapTitle"></h1>
    <div class="recap" id="recap"></div>
    <div class="row"><button class="btn yes" id="sendBtn">Envoyer ma réponse 💌</button></div>
    <div id="toast5" class="hand"></div>
  </section>

  <!-- 6. FIN -->
  <section class="screen" id="s6">
    <img class="pic" data-img="roses" alt="" style="max-width:240px"><div class="ph">IMG_ROSES<br>(gif roses)</div>
    <h1 data-t="endTitle"></h1>
    <p class="hand" data-t="endSub"></p>
    <img class="pic" data-img="final" alt="" style="max-width:220px;border-radius:16px"><div class="ph">IMG_FINAL<br>(selfie / photo de vous)</div>
  </section>
</main>

<!-- MODAL "crise cardiaque" -->
<div id="alert">
  <div class="box">
    <img data-img="heart" alt=""><div class="ph" style="display:flex;margin:0 auto 10px">IMG_HEART<br>(radio du cœur)</div>
    <h1 data-t="alertTitle" style="font-size:24px"></h1>
    <p class="sub" data-t="alertSub"></p>
    <button class="btn yes" id="alertClose">D'accord je te laisse respirer</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4.4.1/dist/email.min.js"></script>
<script>
/* =====================================================================
   ⚙️  CONFIG — TOUT CE QUE TU PEUX MODIFIER EST ICI
   ===================================================================== */

// --- EmailJS ---
const EMAILJS = {
  publicKey:  '2lVDC0ezhk9im03Pk',
  serviceId:  'service_9s6d3qk',      // <-- à remplacer (EmailJS > Email Services)
  templateId: 'template_08iokwr'
};

// --- IMAGES (mets tes chemins ici) ---
const IMAGES = {
  cat:    'assets/cat.png',       // IMG_4780 : chat avec la fleur (écran d'intro)
  askCat: 'assets/cat2.png',   // NOUVELLE : un chat/mème qui supplie (écran de la question)
  chad:   'assets/chad.png',      // IMG_4779 : le gars carré, "narrateur" qui commente tes choix
  heart:  'assets/heart.jpeg',     // IMG_3967 : radio du cœur (popup quand elle spamme "Non")
  roses:  'assets/roses.gif',     // roses.gif : écran final
  final:  'assets/final.png'      // NOUVELLE : une photo de vous / mème de victoire (écran final)
};

// --- TEXTES ---
const TEXT = {
  story: [
    "Alors alors, je me demandais... juste comme ça...",
    "Siiii il était évenntuellement possible de... peut-être... sortir avec toi (genre euh une sortie tt les deux) ?",
    "Pour le coup j'aurai pu juste te faire un message ...",
    "Mais c'est moins stylé"
  ],
  askTitle: "On sort ??",
  askSub:   "(si tu veux hyn ?)",
  yesLabel: "Oui 💖",
  noLabel:  "Non",
  // Phrases qui s'affichent quand elle essaie d'appuyer sur "Non"
  noToasts: [
    "Oups, le bouton a glissé",
    "Il est timide, le coquin.",
    "Tu es sûre ? Vraiment ?",
    "Nan",
    "Même lui n'y croit pas.",
    "Huh ?",
    "Je peux faire ça toute la journée",
    "Regarde plutôt le bouton Oui, il brille de milles feux."
  ],
  actTitle:  "Alors, on fait quoi ?",
  vibeTitle: "Quelle vibe ?",
  detTitle:  "Dernières infos",
  detSub:    "Je note tout, promis.",
  recapTitle:"Récap de la mission 💌",
  endTitle:  "Réponse envoyée !! 🎉",
  endSub:    "Je te dis très vite la suite… prépare-toi 😌",
  alertTitle:"POURQUOIIIIII",
  alertSub:  "trop tiste... Bah réessaie !"
};

// Choix : [emoji, label, réaction du narrateur]
const ACTIVITIES = [
  ["🎬","Ciné","Classique. Efficace."],
  ["🍝","Restaurant","Une personne de goût. Je valide."],
  ["🌳","Balade simple","Marcher et parler. Le retour des vraies valeurs."],
  ["🎳","Activité fun","Moi jsuis trop nul."],
  ["✨","Autre","Ah, du sur-mesure. Ça m'intéresse."]
];
const VIBES = [
  ["🤵","Bien habillé","On sort le grand jeu."],
  ["👕","Décontracté","Le confort, c'est sympa."],
  ["🧸","Cosy / pull XXL","Pas malll"],
  ["🏃","Sportif","🤷‍♀️"],
  ["🎭","Déguisés (ouais genre stp pas déguisé 🥀 c'était pour compléter la grille)","Je n'avais pas prévu ça. Je dis oui."],
  ["✨","Autre","Surprends-moi."]
];
const EXCITE = ["😴","🙂","😊","🤩","🚀"];

/* =====================================================================
   FIN CONFIG — le reste, c'est la mécanique
   ===================================================================== */

const $ = s => document.querySelector(s);
const answers = { activity:'', vibe:'', date:'', time:'', note:'', excite:'', noAttempts:0 };
const startTime = Date.now();

/* images + textes */
document.querySelectorAll('img[data-img]').forEach(img=>{
  img.addEventListener('error',()=>img.classList.add('broken'));
  img.src = IMAGES[img.dataset.img];
});
document.querySelectorAll('[data-t]').forEach(el=>el.textContent = TEXT[el.dataset.t]);
$('#yesBtn').textContent = TEXT.yesLabel; $('#noBtn').textContent = TEXT.noLabel;

/* navigation */
function go(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $(id).classList.add('active');
}

/* cœurs qui montent */
setInterval(()=>{
  const f=document.createElement('div'); f.className='floater';
  f.textContent=['💖','💕','🌸','✨','🌹'][Math.floor(Math.random()*5)];
  f.style.left=Math.random()*100+'vw'; f.style.animationDuration=(6+Math.random()*6)+'s';
  $('#floaters').appendChild(f); setTimeout(()=>f.remove(),12000);
},700);

/* 0. histoire (machine à écrire) */
let line=0, typing=false;
function typeLine(){
  const el=$('#story'); el.textContent=''; typing=true; el.classList.add('caret');
  const t=TEXT.story[line]; let i=0;
  const iv=setInterval(()=>{
    el.textContent=t.slice(0,++i);
    if(i>=t.length){clearInterval(iv);typing=false;}
  },32);
  $('#nextStory').textContent = line===TEXT.story.length-1 ? "Et alors ?!" : "Suivant";
}
$('#nextStory').onclick=()=>{
  if(typing) return;
  if(line<TEXT.story.length-1){line++;typeLine();} else go('#s1');
};
typeLine();

/* 1. le bouton Non qui fuit */
const noBtn=$('#noBtn'), yesBtn=$('#yesBtn'); let yesScale=1;
function flee(e){
  e&&e.preventDefault&&e.preventDefault();
  answers.noAttempts++;
  noBtn.classList.add('fleeing');
  const w=noBtn.offsetWidth,h=noBtn.offsetHeight;
  noBtn.style.left=Math.max(8,Math.random()*(innerWidth-w-16))+'px';
  noBtn.style.top =Math.max(8,Math.random()*(innerHeight-h-16))+'px';
  yesScale=Math.min(yesScale+0.12,2.1); yesBtn.style.transform=`scale(${yesScale})`;
  $('#toast').textContent=TEXT.noToasts[(answers.noAttempts-1)%TEXT.noToasts.length];
  if(answers.noAttempts===7) $('#alert').classList.add('show');
}
['pointerenter','click','touchstart'].forEach(ev=>noBtn.addEventListener(ev,flee,{passive:false}));
$('#alertClose').onclick=()=>$('#alert').classList.remove('show');
yesBtn.onclick=()=>{ confetti(); noBtn.style.display='none'; setTimeout(()=>go('#s2'),900); };

/* 2 & 3. choix avec "autre" */
function buildChips(list,box,otherBox,bubble,nextBtn,key,otherInput){
  list.forEach(([e,label,react])=>{
    const b=document.createElement('button'); b.className='chip';
    b.innerHTML=`<span class="e">${e}</span>${label}`;
    b.onclick=()=>{
      box.querySelectorAll('.chip').forEach(c=>c.classList.remove('sel')); b.classList.add('sel');
      $(bubble).textContent=react;
      const isOther = label==='Autre';
      $(otherBox).classList.toggle('show',isOther);
      answers[key]=isOther?'':label; b.dataset.other=isOther;
      check();
    };
    box.appendChild(b);
  });
  const check=()=>{
    const sel=box.querySelector('.chip.sel'); if(!sel) return;
    const other=sel.dataset.other==='true';
    if(other) answers[key]=$(otherInput).value.trim();
    $(nextBtn).disabled = !answers[key];
  };
  $(otherInput).addEventListener('input',check);
}
$('#chad2').textContent="Choisis bien. Je regarde.";
$('#chad3').textContent="Dernière étape de style.";
buildChips(ACTIVITIES,$('#actChips'),'#actOther','#chad2','#actNext','activity','#actOtherInput');
buildChips(VIBES,$('#vibeChips'),'#vibeOther','#chad3','#vibeNext','vibe','#vibeOtherInput');
$('#actNext').onclick=()=>go('#s3');
$('#vibeNext').onclick=()=>go('#s4');

/* 4. détails */
$('#dExcite').oninput=e=>$('#excite').textContent=EXCITE[e.target.value];
$('#excite').textContent=EXCITE[2];
$('#detNext').onclick=()=>{
  answers.date=$('#dDate').value; answers.time=$('#dTime').value;
  answers.note=$('#dNote').value.trim(); answers.excite=EXCITE[$('#dExcite').value];
  const fmtDate = answers.date ? new Date(answers.date).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}) : 'à définir ensemble';
  answers.dateNice=fmtDate;
  $('#recap').innerHTML=
    `🎯 Activité : <b>${answers.activity}</b><br>👗 Vibe : <b>${answers.vibe}</b><br>`+
    `📅 Quand : <b>${fmtDate}${answers.time?' à '+answers.time:''}</b><br>`+
    `${answers.excite} Excitation : <b>${$('#dExcite').value*25}%</b>`+
    (answers.note?`<br>💬 Note : <b>${answers.note.replace(/</g,'&lt;')}</b>`:'');
  go('#s5');
};

/* 5. envoi EmailJS */
$('#sendBtn').onclick=async()=>{
  const btn=$('#sendBtn'); btn.disabled=true; btn.textContent='Envoi en cours… 🚀';
  try{
    emailjs.init({publicKey:EMAILJS.publicKey});
    await emailjs.send(EMAILJS.serviceId,EMAILJS.templateId,{
      activity:answers.activity, vibe:answers.vibe,
      date:answers.dateNice, time:answers.time||'—',
      note:answers.note||'(rien de spécial)',
      excite:answers.excite+' '+($('#dExcite').value*25)+'%',
      no_attempts:answers.noAttempts,
      seconds:Math.round((Date.now()-startTime)/1000)
    });
    go('#s6'); confetti(180);
  }catch(err){
    console.error(err);
    btn.disabled=false; btn.textContent='Réessayer 💌';
    $('#toast5').textContent="Oups, l'envoi a raté. Réessaie !";
  }
};

/* confettis maison */
function confetti(n=120){
  const c=$('#confetti'),x=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight;
  const cols=['#ff5c8a','#ffd166','#bdf0dc','#fff','#ff9e7a'];
  const p=Array.from({length:n},()=>({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*16,vy:Math.random()*-14-3,
    s:5+Math.random()*7,c:cols[Math.floor(Math.random()*cols.length)],r:Math.random()*6}));
  let f=0;(function draw(){
    x.clearRect(0,0,c.width,c.height);
    p.forEach(o=>{o.x+=o.vx;o.y+=o.vy;o.vy+=.35;o.r+=.2;x.save();x.translate(o.x,o.y);x.rotate(o.r);x.fillStyle=o.c;x.fillRect(-o.s/2,-o.s/2,o.s,o.s*.6);x.restore();});
    if(++f<140) requestAnimationFrame(draw); else x.clearRect(0,0,c.width,c.height);
  })();
}
</script>
</body>
</html>
